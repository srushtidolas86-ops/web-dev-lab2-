<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Navbar and Card Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar"><a href="#top">My Page</a><a href="#cards">Cards</a><a href="#about">About</a></nav>
  <main id="top"><section class="intro"><h1>CSS Positioning</h1><p>Scroll down to see the sticky navigation and the text placed over a card.</p></section>
  <section id="cards"><h2>My Cards</h2><div class="card"><div class="card-image"></div><div class="card-caption"><h3>Learning Web Development</h3><p>Practising position relative and absolute.</p></div></div></section>
  <section id="about" class="extra"><h2>About this practical</h2><p>The navbar sticks to the top. The card text is positioned over the card area.</p></section></main>
</body>
</html>
